pluginManagement {
    repositories {
        maven {
            url "https://maven.fabricmc.net"
        }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'charmony'

// Trimmed for local Charmonium build: only core, api, ambient_sounds and the charmonium collection.
include 'mods:core', 'mods:api', 'mods:ambient_sounds'
include 'collections:charmonium'