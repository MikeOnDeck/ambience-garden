pluginManagement {
    repositories {
        maven {
            url "https://maven.fabricmc.net"
        }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'charmony'

include 'mods:core', 'mods:api', 'mods:ambient_sounds', 'mods:travel_journal', 'mods:tweaks'
include 'collections:realms_companion', 'collections:charmonium'

include 'mods:tasks'