plugins {
    id 'java'
}

addTomlDependencies()
addSubprojectDependency(':mods:api')
addSubprojectDependency(':mods:core')

def assetUrls = [
    biomes: 'https://charmony.dev/assets/ambient_sounds/biomes.zip',
    environment: 'https://charmony.dev/assets/ambient_sounds/environment.zip'
]

tasks.register('downloadAmbientSounds') {
    description = 'Downloads and extracts required asset archives for ambient_sounds.'
    group = 'assets'

    doLast {
        def soundsDir = file("${projectDir}/src/main/resources/assets/charmony/sounds")
        if (!soundsDir.exists()) {
            soundsDir.mkdirs()
        }
        assetUrls.each { name, url ->
            def zipFile = file("${buildDir}/tmp/${name}.zip")
            zipFile.parentFile.mkdirs() // Ensure build/tmp exists
            if (!zipFile.exists()) {
                println "Downloading ${name} assets from ${url}..."
                new URI(url).toURL().withInputStream { i ->
                    zipFile.withOutputStream { it << i }
                }
            } else {
                println "${zipFile} already exists, skipping download."
            }
            println "Extracting ${zipFile} to ${soundsDir}..."
            copy {
                from zipTree(zipFile)
                into soundsDir
            }
        }
    }
}