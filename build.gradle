plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version + '+' + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.fabricmc.net"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered { 
        officialMojangMappings() 
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    
    // TOML dependencies
    implementation "com.moandjiezana.toml:toml4j:${toml4j_version}"
    implementation "com.electronwill.night-config:core:${tomlnc_version}"
    implementation "com.electronwill.night-config:toml:${tomlnc_version}"
    include "com.moandjiezana.toml:toml4j:${toml4j_version}"
    include "com.electronwill.night-config:core:${tomlnc_version}"
    include "com.electronwill.night-config:toml:${tomlnc_version}"
    
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    accessWidenerPath = file("src/main/resources/ambience_garden.accesswidener")
}

processResources {
    inputs.property "mod_version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_version", project.java_version

    filesMatching("fabric.mod.json") {
        expand (
            "mod_version": project.mod_version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version,
            "java_version": project.java_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}
