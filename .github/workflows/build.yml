name: Build Charmonium

on:
  push:
    branches: ['1.21.11', 'cursor/**']
  pull_request:
    branches: ['1.21.11']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for tracked .ogg files
        run: |
          if git ls-files '*.ogg' | grep -q .; then
            echo "ERROR: .ogg files are tracked in git!"
            echo "The following .ogg files should not be committed:"
            git ls-files '*.ogg'
            exit 1
          fi
          echo "✓ No .ogg files tracked in git"
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/1.21.11' }}
      
      - name: Fetch sound assets
        run: ./scripts/fetch-sounds.sh
        env:
          SOUNDS_ARCHIVE_TOKEN: ${{ secrets.SOUNDS_ARCHIVE_TOKEN }}
      
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      
      - name: Find Charmonium jar
        id: find_jar
        run: |
          JAR_PATH=$(find collections/charmonium/build/libs -name "charmonium-*.jar" -not -name "*-sources.jar" -not -name "*-dev.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "ERROR: Could not find built Charmonium jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
          JAR_SIZE=$(du -h "$JAR_PATH" | cut -f1)
          echo "jar_size=$JAR_SIZE" >> $GITHUB_OUTPUT
          echo "✓ Found jar: $JAR_PATH ($JAR_SIZE)"
      
      - name: Upload Charmonium jar
        uses: actions/upload-artifact@v4
        with:
          name: charmonium-jar
          path: ${{ steps.find_jar.outputs.jar_path }}
          if-no-files-found: error
      
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          name: Charmonium ${{ github.ref_name }} Build ${{ github.run_number }}
          body: |
            Automated build of Charmonium for Minecraft 1.21.11 (Fabric)
            
            Built from commit ${{ github.sha }}
            
            **Installation:**
            - Requires Fabric Loader 0.19.5 or higher
            - Requires Fabric API 0.141.6+1.21.11
            - Requires Java 21
            
            The Charmony core, API, and Ambient Sounds modules are included (jar-in-jar).
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: true
