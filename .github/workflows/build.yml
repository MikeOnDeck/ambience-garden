name: Build Ambience Garden

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for tracked .ogg files
        run: |
          if git ls-files '*.ogg' | grep -q .; then
            echo "ERROR: .ogg files are tracked in git!"
            echo "The following .ogg files should not be committed:"
            git ls-files '*.ogg'
            exit 1
          fi
          echo "✓ No .ogg files tracked in git"
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      - name: Fetch sound assets
        run: chmod +x scripts/fetch-sounds.sh && ./scripts/fetch-sounds.sh
        env:
          SOUNDS_ARCHIVE_TOKEN: ${{ secrets.SOUNDS_ARCHIVE_TOKEN }}
      
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      
      - name: Find Ambience Garden jar
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "ambience-garden-*.jar" -not -name "*-sources.jar" -not -name "*-dev.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "ERROR: Could not find built Ambience Garden jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
          JAR_SIZE=$(du -h "$JAR_PATH" | cut -f1)
          echo "jar_size=$JAR_SIZE" >> $GITHUB_OUTPUT
          echo "✓ Found jar: $JAR_PATH ($JAR_SIZE)"
          
          # List contents
          echo "=== Jar contents ==="
          unzip -l "$JAR_PATH" | grep -E "(fabric.mod.json|com/mikeondeck|META-INF)" | head -20
      
      - name: Upload Ambience Garden jar
        uses: actions/upload-artifact@v4
        with:
          name: ambience-garden-jar
          path: ${{ steps.find_jar.outputs.jar_path }}
          if-no-files-found: error
      
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ambience Garden v1.0.0 Build ${{ github.run_number }}
          body: |
            Automated build of Ambience Garden for Minecraft 1.21.11 (Fabric)
            
            Built from commit ${{ github.sha }}
            
            **Installation:**
            - Requires Fabric Loader 0.19.5 or higher
            - Requires Fabric API 0.141.6+1.21.11
            - Requires Java 21
            
            **Note**: This is a private build. Sound asset licensing is under review.
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: true
          prerelease: true
